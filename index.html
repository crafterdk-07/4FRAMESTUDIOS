<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4FRAME STUDIOS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sirf Home Page ka specific CSS */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            /* Agar background image lagani ho to yaha URL add karein */
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%); 
        }

        .production-name {
            font-size: 1.2rem;
            letter-spacing: 5px;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .studio-name {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 40px;
            max-width: 600px;
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--bg-color);
            background-color: var(--primary-color);
            border-radius: 5px;
            transition: 0.3s ease;
        }

        .btn:hover {
            background-color: var(--text-color);
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">4FRAME <span>STUDIOS</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="upcoming.html">Upcoming</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero-section">
        <div class="production-name">Frame X Production Presents</div>
        <h1 class="studio-name">4FRAME STUDIOS</h1>
        <p class="tagline">Striving to Make the Best Movies & Videos. Welcome to our creative universe.</p>
        <a href="upcoming.html" class="btn">Explore Upcoming Projects</a>
    </section>

    <footer>
        <p>&copy; 2026 4FRAME STUDIOS. All rights reserved. | <a href="admin.html" class="admin-link">Admin</a></p>
    </footer>


</body>
</html>
